[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agenteta"
version = "0.1.0"
description = "History-based ETA quotes, overdue checks and miss logging for agent jobs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agenteta = "agenteta.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["agenteta"]
